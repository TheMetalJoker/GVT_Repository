<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2D-Geometrie aus Linien</title>
</head>
<body>
  <h1>Meine 2D-Geometrie</h1>
  <canvas id="glCanvas" width="600" height="600">
    Dein Browser unterstützt kein Canvas.
  </canvas>

  <!-- Vertex-Shader: übernimmt die Position jedes Vertex -->
  <script id="vertex-shader" type="x-shader/x-vertex">
    attribute vec2 aPosition;

    void main() {
      gl_Position = vec4(aPosition, 0.0, 1.0);
    }
  </script>

  <!-- Fragment-Shader: bestimmt die Farbe der gezeichneten Linien -->
  <script id="fragment-shader" type="x-shader/x-fragment">
    precision mediump float;

    void main() {
      gl_FragColor = vec4(0.1, 0.35, 0.8, 1.0);
    }
  </script>

  <script src="script.js"></script>
</body>
</html>
